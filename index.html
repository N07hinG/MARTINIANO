<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MARTINIANO · ABInBev</title>
<!-- Rutas RELATIVAS: funcionan bajo https://n07hing.github.io/MARTINIANO/ -->
<link rel="stylesheet" href="./style.css">
<script type="importmap">
{"imports":{
 "firebase/app":"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
 "firebase/auth":"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js",
 "firebase/firestore":"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"}}
</script>
</head>
<body>

<!-- ENCABEZADO: botón que abre el menú (perfil / cambiar rol / cerrar sesión) -->
<header id="hdr">
  <button id="hbtn" class="hbtn" aria-haspopup="menu" aria-expanded="false">
    <span class="pic ph" id="hav"></span><b>ABInBev</b><span id="live" class="live">● …</span>
  </button>
  <nav id="menu" class="menu" hidden>
    <button data-a="perfil">Ver perfil</button>
    <button data-a="rol">Cambiar rol</button>
    <button data-a="logout" class="dng-t">Cerrar sesión</button>
  </nav>
</header>

<div id="err" hidden></div>

<!-- PANTALLA 1: sólo login (si no hay usuario) -->
<section id="login" class="screen" hidden>
  <div class="lbox">
    <h1>MARTINIANO</h1>
    <p>Control de montacarguistas, asistentes y supervisores</p>
    <button id="gbtn" class="full blk">
      <svg width="22" height="22" viewBox="0 0 48 48"><path fill="#ffc107" d="M43.6 20H24v8h11.3C33.7 32.7 29.3 36 24 36a12 12 0 1 1 7.9-21l5.7-5.7A20 20 0 1 0 44 24c0-1.3-.1-2.7-.4-4z"/><path fill="#ff3d00" d="M6.3 14.7l6.6 4.8A12 12 0 0 1 31.9 15l5.7-5.7A20 20 0 0 0 6.3 14.7z"/><path fill="#4caf50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2A12 12 0 0 1 12.7 28l-6.5 5A20 20 0 0 0 24 44z"/><path fill="#1976d2" d="M43.6 20H24v8h11.3a12 12 0 0 1-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.7-.4-4z"/></svg>
      Ingresar con Google
    </button>
  </div>
</section>

<!-- PANTALLA 2: aplicación (sólo con usuario + rol) -->
<main id="app" hidden>
  <div class="card"><div id="clock"></div></div>
  <nav class="tabs" id="tabs"></nav>
  <div id="view"></div>
</main>

<div id="modal" class="modal" hidden></div>
<div id="toast"></div>
<footer id="foot">Martiniano - Creado por Borys Orellana - Firebase Live</footer>

<!-- Visor de errores (visible en pantalla para diagnosticar) -->
<script>
window.showErr=function(m){var e=document.getElementById('err');e.hidden=false;e.textContent=m};
addEventListener('error',function(e){showErr('Error: '+e.message)});
addEventListener('unhandledrejection',function(e){showErr('Error: '+(e.reason&&e.reason.message||e.reason))});
setTimeout(function(){if(!window.__ok)showErr('No se pudo cargar Firebase. Revisa tu internet o actualiza el navegador.')},8000);
</script>
<script type="module" src="./app.js"></script>
</body>
</html>
