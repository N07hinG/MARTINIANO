<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MARTINIANO · ABInBev</title>
<!-- Rutas RELATIVAS y en minúsculas: funcionan en https://n07hing.github.io/MARTINIANO/ -->
<link rel="stylesheet" href="./style.css">
<script type="importmap">
{"imports":{
 "firebase/app":"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
 "firebase/firestore":"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"}}
</script>
</head>
<body>

<!-- ENCABEZADO: menú (perfil / cambiar rol / cerrar sesión) -->
<header id="hdr">
  <button id="hbtn" class="hbtn" aria-haspopup="menu" aria-expanded="false">
    <span class="pic ph" id="hav"></span><b>ABInBev</b><span id="live" class="live">● …</span>
  </button>
  <nav id="menu" class="menu" hidden>
    <button data-a="perfil">Ver perfil</button>
    <button data-a="rol">Cambiar nombre / rol</button>
    <button data-a="logout" class="dng-t">Cerrar sesión</button>
  </nav>
</header>

<div id="err" hidden></div>

<!-- ACCESO DIRECTO: sólo nombre + rol + ENTRAR -->
<section id="login" class="screen" hidden>
  <div class="lbox">
    <input id="nombre" type="text" placeholder="Nombre del usuario" autocomplete="off" maxlength="60">
    <select id="rol">
      <option value="" selected disabled>Selecciona tu rol</option>
      <option value="montacarguista">Montacarguista</option>
      <option value="asistente">Asistente de almacén</option>
      <option value="supervisor">Supervisor</option>
    </select>
    <div id="lerr" class="rerr"></div>
    <button id="enter" class="full blk">ENTRAR</button>
    <button id="cancel" class="full" hidden>Cancelar</button>
  </div>
</section>

<!-- APLICACIÓN -->
<main id="app" hidden>
  <div class="card"><div id="clock"></div></div>
  <nav class="tabs" id="tabs"></nav>
  <div id="view"></div>
</main>

<div id="modal" class="modal" hidden></div>
<div id="toast"></div>
<footer id="foot">Martiniano - Creado por Borys Orellana - Firebase Live</footer>

<!-- Visor de errores en pantalla (para diagnosticar) -->
<script>
window.showErr=function(m){var e=document.getElementById('err');e.hidden=false;e.textContent=m};
addEventListener('error',function(e){showErr('Error: '+e.message)});
addEventListener('unhandledrejection',function(e){showErr('Error: '+(e.reason&&e.reason.message||e.reason))});
setTimeout(function(){if(!window.__ok)showErr('No se pudo cargar Firebase. Revisa tu internet o actualiza el navegador.')},8000);
</script>
<script type="module" src="./app.js"></script>
</body>
</html>
